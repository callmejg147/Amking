    function sendwhatsapp() {
      var phn = "+919630030053";

      var fname = document.querySelector('.fname').value;
      var lname = document.querySelector('.lname').value;
      var phone = document.querySelector('.phn').value;
      var email = document.querySelector('.em').value;
      var sub = document.querySelector('.sub').value;
      var msg = document.querySelector('.msg').value;

      var url = "https://wa.me/" + phn + "?text="
      +"*Name :* " +fname+" "+lname+"%0a"
      +"*Phone :* " +phone+"%0a"
      +"*Email :* " +email+"%0a"
      +"*Subject :* " +sub+"%0a"
      +"    "+msg+"%0a";

      window.open(url, '_blank').focus();
      document.enquiryForm.reset();
    }
  </script>
